# The skive box. Values come from `.env` via compose's automatic
# substitution; a missing `.env` just leaves the defaults in place.
services:
  skive:
    build: 
      context: .
      dockerfile: Containerfile
    image: skive-box
    # Rootless podman already maps container-root to the invoking host user,
    # so 0 is the podman-correct default. Rootful docker users export their
    # uid:gid here (SKIVE_UID/SKIVE_GID in .env) to keep library files
    # host-owned instead of root-owned.
    user: "${SKIVE_UID:-0}:${SKIVE_GID:-0}"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - MAKEMKV_KEY=${MAKEMKV_KEY:-}
      - VIDEOS_MOUNT=${VIDEOS_MOUNT:-/mnt/videos}
      - MUSIC_MOUNT=${MUSIC_MOUNT:-/mnt/music}
      - RIP_MINLENGTH=${RIP_MINLENGTH:-120}
      # Path.home() and makemkvcon both follow HOME; the named volume below
      # keeps ~/.MakeMKV/settings.conf across restarts.
      - HOME=/var/skive-home
    volumes:
      # Shares land at the same path inside the box as on the host: operator
      # and skive agree on one path per share. Local-dir targets on a dev
      # box produce skive's local-share warn — expected.
      - type: bind
        source: ${VIDEOS_MOUNT:-/mnt/videos}
        target: ${VIDEOS_MOUNT:-/mnt/videos}
      - type: bind
        source: ${MUSIC_MOUNT:-/mnt/music}
        target: ${MUSIC_MOUNT:-/mnt/music}
      - skive-home:/var/skive-home
    devices:
      # Compose has no globs — explicit nodes for the two-drive reality.
      # Devices resolve at run time only; `compose config` parses on
      # drive-less boxes without them existing.
      - /dev/sr0:/dev/sr0
      - /dev/sr1:/dev/sr1
      - /dev/sg0:/dev/sg0
      - /dev/sg1:/dev/sg1
      - /dev/sg2:/dev/sg2
      - /dev/sg3:/dev/sg3
      - /dev/dri:/dev/dri
volumes:
  skive-home:
