# Transcode box manifest — `distrobox assemble create`, then `distrobox enter transcode`.
# Every hook re-runs on each enter, so all steps are guarded and idempotent.
# Updating skive: `git pull` inside ~/git/cd-rip-stack (editable install picks changes up).
# Bumping seconv: change SECONV_VER below (and the two places it appears in paths).
# NO mise on this machine — mise.toml belongs to the rip box only.

[transcode]
name=transcode
image=fedora:41
# videos share bind-mount (host NFS mount at /mnt/videos, docs/setup.md)
mounts=/mnt/videos:/mnt/videos:rw

# Root, pre-init, explicitly ordered: rpmfusion release rpms first, then
# packages, then seconv. dnf -y install is idempotent on its own; the release
# rpms and seconv tarball are guarded.
pre_init_hooks=
  if ! rpm -q rpmfusion-free-release >/dev/null 2>&1; then dnf install -y https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-41.noarch.rpm; fi
  if ! rpm -q rpmfusion-nonfree-release >/dev/null 2>&1; then dnf install -y https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-41.noarch.rpm; fi
  dnf install -y handbrake-cli mkvtoolnix ffmpeg tesseract tesseract-langpack-eng tesseract-langpack-dan libicu git uv
  SECONV_VER=5.3.0
  if [ ! -e /usr/local/bin/seconv ]; then rm -rf "/opt/seconv-${SECONV_VER}" && mkdir -p "/opt/seconv-${SECONV_VER}" && curl -fsSL "https://github.com/SubtitleEdit/subtitleedit/releases/download/v${SECONV_VER}/SeConv-Linux-x64.tar.gz" | tar xz -C "/opt/seconv-${SECONV_VER}" && ln -s "/opt/seconv-${SECONV_VER}/seconv" /usr/local/bin/seconv; fi

# User init: clone the repo and install skive editable via uv, guarded.
init_hooks=
  if [ ! -d "$HOME/git/cd-rip-stack" ]; then mkdir -p "$HOME/git" && git clone https://github.com/OpalBolt/cd-rip-stack.git "$HOME/git/cd-rip-stack"; fi
  if ! command -v skive >/dev/null 2>&1; then (cd "$HOME/git/cd-rip-stack" && uv tool install --editable .); fi
