# Transcode box manifest — `distrobox assemble create`, then `distrobox enter transcode`.
# Every hook re-runs on each enter, so all steps are guarded and idempotent.
# Updating skive: `git pull` inside ~/git/cd-rip-stack (editable install picks changes up).
# Bumping seconv: edit the version in the pre_init_hooks line below.
# NO mise on this machine — mise.toml belongs to the rip box only.
#
# shortcut: distrobox-assemble cannot parse multiline hook values (each
# continuation line becomes a mangled extra declaration) and strips user
# quotes, so every hook is ONE line with no quotes; paths here have no spaces.

[transcode]
name=transcode
image=fedora:41
# videos share bind-mount (host NFS mount at /mnt/videos, docs/setup.md)
mounts=/mnt/videos:/mnt/videos:rw

# Root, pre-init, explicitly ordered: rpmfusion release rpms first, then
# packages, then seconv (pinned v5.3.0).
pre_init_hooks=rpm -q rpmfusion-free-release || dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-41.noarch.rpm; rpm -q rpmfusion-nonfree-release || dnf install -y https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-41.noarch.rpm; dnf install -y handbrake-cli mkvtoolnix ffmpeg tesseract tesseract-langpack-eng tesseract-langpack-dan libicu git uv; test -e /usr/local/bin/seconv || { mkdir -p /opt/seconv-5.3.0; curl -fsSL https://github.com/SubtitleEdit/subtitleedit/releases/download/v5.3.0/SeConv-Linux-x64.tar.gz | tar xz -C /opt/seconv-5.3.0; ln -sf /opt/seconv-5.3.0/seconv /usr/local/bin/seconv; }

# User init: clone the repo and install skive editable via uv, guarded.
init_hooks=test -d $HOME/git/cd-rip-stack || { mkdir -p $HOME/git; git clone https://github.com/OpalBolt/cd-rip-stack.git $HOME/git/cd-rip-stack; }; command -v skive >/dev/null 2>&1 || cd $HOME/git/cd-rip-stack && uv tool install --editable .
