# Generated by the setup-pre-commit skill v5761d824025f — regenerate with its assemble.sh.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # git does this itself; it also flags leftover conflict markers
      - id: whitespace
        name: whitespace and conflict markers
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python3 -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: shfmt
        name: shfmt
        entry: shfmt --write
        language: system
        types: [shell]

  - repo: local
    hooks:
      # hadolint via mise: user-space install, no container runtime needed;
      # the version sits here — the one pin in the config, bump in place.
      - id: hadolint
        name: hadolint (mise)
        entry: mise x hadolint@2.15.1 -- hadolint --failure-threshold error
        language: system
        types: [dockerfile]

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        types: [markdown]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: system
        types: [text]

  - repo: local
    hooks:
      # gitleaks runs on its embedded default rules; a repo needing extras
      # adds gitleaks.toml with useDefault = true, which extends them.
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --staged --redact
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gitleaks-history
        name: gitleaks (full history)
        entry: gitleaks git --redact
        language: system
        pass_filenames: false
        stages: [pre-push]
