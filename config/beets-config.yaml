# beets config — edit directory/paths to taste
directory: /mnt/music/library
library: /mnt/music/music.db

# Relative paths in a config file resolve from this file, not beets' cwd.
pluginpath: ../beetsplug
plugins: fetchart embedart lastgenre ftintitle replaygain scrub the zero musicbrainz bandcamp skive_album

# "The Beatles" sorts under B. Required for %the{} used in paths below.
the:
  a: yes
  the: yes

# Filesystem layout. Flat: all tracks drop straight into the album folder
# (disc subfolders dropped). Year prefixes each segment so folders sort
# chronologically. (No custom `replace` — beets' built-in default strips only
# illegal chars and keeps spaces.)
paths:
  default: %the{$albumartist}/$year $album%aunique{}/$track - $title
  singleton: _Singles/%the{$artist}/$year $title
  albumtype:soundtrack: _Soundtracks/$year $album%aunique{}/$track - %the{$artist} - $title
  comp: _Compilations/$year $album%aunique{}/$track - %the{$artist} - $title

import:
  copy: no
  move: yes
  write: yes
  timid: no
  resume: ask
  incremental: no
  quiet_fallback: skip
  default_action: apply
  duplicate_action: ask
  log: /mnt/music/logs/import.log

match:
  strong_rec_thresh: 0.1 # auto-apply >=85% (default 0.04 = 96%; tune to 0.10 = 90%)

# built-in, enabled by default — configure here to set preferences
musicbrainz:
  host: musicbrainz.org
  ratelimit_interval: 1.0

bandcamp:
  search_max: 5
  genre:
    mode: progressive # classical | progressive | psychedelic (looser = more genres)

fetchart:
  auto: yes
  cover_format: JPEG
  enforce_ratio: yes
  minwidth: 500
  maxwidth: 1000
  sources:
    - filesystem
    - coverart
    - itunes
    - amazon
    - albumart
    - cover_art_url # bandcamp: beetcamp supplies the URL, fetchart downloads it

embedart:
  auto: yes
  maxwidth: 500

lastgenre:
  auto: yes
  count: 3
  separator: "; "
  source: track
  title_case: yes

ftintitle:
  auto: yes
  format: feat. {0}

replaygain:
  auto: yes
  backend: gstreamer
  overwrite: yes

scrub:
  auto: yes

# Removes the listed fields unconditionally (not just when empty).
# Trimmed: beetcamp (bandcamp) fills comments/lyrics/albumstatus/label/
# country/catalognum/media, so those are kept. albumtype also kept (soundtrack path).
zero:
  fields:
    - language
    - script
