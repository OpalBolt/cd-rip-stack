[project]
name = "skive"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "rich",
    "beets",
    "pylast",
    "pillow",
    "beetcamp",
    "textual>=8.2.8",
]

[project.scripts]
skive = "skive.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff==0.17.5"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# stock ruff 0.17 default rule set, minus:
ignore = [
    "SIM117", # merging nested `with` blocks is pure churn at this scale
]
