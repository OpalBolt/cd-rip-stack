[project]
name = "skive"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "rich",
    "beets",
    "pylast",
    "pillow",
    "beetcamp",
    "textual>=8.2.8",
]

[project.scripts]
skive = "skive.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship config/ and beetsplug/ next to the package so the baked (non-editable)
# install resolves them: skive looks them up at Path(__file__).parent.parent,
# which is site-packages in a wheel install.
[tool.hatch.build.targets.wheel.force-include]
"config" = "config"
"beetsplug" = "beetsplug"

[dependency-groups]
dev = ["pytest", "ruff==0.17.5", "mypy==2.4.1"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# stock ruff 0.17 default rule set, minus:
ignore = [
    "SIM117", # merging nested `with` blocks is pure churn at this scale
]

[tool.mypy]
python_version = "3.13"
files = ["skive"]
ignore_missing_imports = true
allow_untyped_defs = true
check_untyped_defs = true
