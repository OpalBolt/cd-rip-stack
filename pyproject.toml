[project]
name = "skive"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "rich",
    "beets",
    "pylast",
    "pillow",
    "beetcamp",
    "loguru>=0.7.3",
]

[project.scripts]
skive = "skive.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = ["real_eject: run the real eject_disc (test injects its own run)"]
